name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install Yarn Classic
        run: command -v yarn || npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # build + test (yarn check без run вызывает встроенную команду Yarn)
      - name: Check
        run: yarn run check

  docker:
    needs: check
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver: docker

      - name: Login to DockerHub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v3
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.PUBLISH == 'true' && format('{0}/{1}:latest', secrets.DOCKERHUB_USERNAME, secrets.DOCKERHUB_REPO) || 'tic-tac-toe-telegram:ci' }}
